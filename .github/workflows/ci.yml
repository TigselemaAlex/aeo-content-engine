# Checks every pull request and every push to main (docs/06 §11).
# The "worker" job is a required status check of the protect-main ruleset:
# a pull request with a red check cannot be merged.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: worker/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff (lint and docstrings)
        run: uv run ruff check --output-format=github

      - name: Ruff (format)
        run: uv run ruff format --check

      - name: Pyright
        run: uv run pyright

      - name: Import contracts
        run: uv run lint-imports

      # The variable crop needs FFmpeg 9 (docs/03 §5.6): Ubuntu's 6.1.1 crashes or hangs when
      # crop changes size mid-video. Pinned build with its sha256 written here, cached by it.
      - name: Cache FFmpeg 9.0.2
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: ffmpeg-0e67c0626ba48a329b3e75fe577b13ade43543fcfe44255ae18d7c06e22fa31a

      - name: Download FFmpeg 9.0.2
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o ffmpeg.tar.xz "https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/autobuild-2026-11-25-12-41/ffmpeg-n9.0.2-963-g4d831360c9-linux64-gpl-9.0.tar.xz"
          echo "0e67c0626ba48a329b3e75fe577b13ade43543fcfe44255ae18d7c06e22fa31a  ffmpeg.tar.xz" | sha256sum -c -
          mkdir -p ffmpeg
          tar -xJf ffmpeg.tar.xz -C ffmpeg --strip-components=1
          rm ffmpeg.tar.xz

      - name: Put FFmpeg on the PATH
        run: |
          echo "${{ runner.temp }}/ffmpeg/bin" >> "$GITHUB_PATH"
          "${{ runner.temp }}/ffmpeg/bin/ffmpeg" -version | head -n 1

      - name: Pytest (unit tests and doctests)
        timeout-minutes: 6
        run: uv run pytest
