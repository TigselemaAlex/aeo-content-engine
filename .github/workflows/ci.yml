# Checks every pull request and every push to main (docs/06 §11).
# The "worker" job is a required status check of the protect-main ruleset:
# a pull request with a red check cannot be merged.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: worker/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff (lint and docstrings)
        run: uv run ruff check --output-format=github

      - name: Ruff (format)
        run: uv run ruff format --check

      - name: Pyright
        run: uv run pyright

      - name: Import contracts
        run: uv run lint-imports

      - name: FFmpeg (for the render integration test)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1

      - name: Diagnose FFmpeg stdin (temporary)
        run: |
          timeout 60 ffmpeg -v error -f lavfi -i testsrc2=size=320x240:rate=30:duration=1 -f null - ; echo "plain exit=$?"
          timeout 60 ffmpeg -nostdin -v error -f lavfi -i testsrc2=size=320x240:rate=30:duration=1 -f null - ; echo "nostdin exit=$?"
          python3 -c "import subprocess; r = subprocess.run(['ffmpeg','-v','error','-f','lavfi','-i','testsrc2=size=320x240:rate=30:duration=1','-f','null','-'], capture_output=True, timeout=60); print('python plain exit', r.returncode)" || echo "python plain FAILED"

      - name: Pytest (unit tests and doctests)
        timeout-minutes: 6
        run: uv run pytest -v
