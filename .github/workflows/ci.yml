# Checks every pull request and every push to main (docs/06 §11).
# The "worker" job is a required status check of the protect-main ruleset:
# a pull request with a red check cannot be merged.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: worker/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff (lint and docstrings)
        run: uv run ruff check --output-format=github

      - name: Ruff (format)
        run: uv run ruff format --check

      - name: Pyright
        run: uv run pyright

      - name: Import contracts
        run: uv run lint-imports

      - name: FFmpeg (for the render integration test)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1

      - name: Diagnose FFmpeg crop (temporary)
        working-directory: ${{ runner.temp }}
        run: |
          ffmpeg -v error -y -f lavfi -i testsrc2=size=1920x1080:rate=30:duration=2 -pix_fmt yuv420p -c:v libx264 m.mp4
          printf '0.0000 [enter] crop@camera x 601;
0.9833 [enter] crop@camera x 700;
' > move.cmd
          printf '0.0000 [enter] crop@camera x 601;
0.9833 [enter] crop@camera w 552, [enter] crop@camera h 982, [enter] crop@camera x 700, [enter] crop@camera y 49;
' > resize.cmd
          run() { echo "=== $1"; timeout 60 ffmpeg -nostdin -v verbose -y -i m.mp4 -filter_complex "$2" -map "[v]" -c:v libx264 -preset veryfast out.mp4 > log.txt 2>&1; echo "exit=$?"; grep -iE "error|invalid|crop|scale|reinit|changing|frame=" log.txt | tail -12; }
          run "move only, crop+scale" "[0:v]sendcmd=f=move.cmd,crop@camera=608:1080:601:0:exact=1,scale=1080:1920:flags=bicubic,setsar=1,format=yuv420p[v]"
          run "resize, crop only" "[0:v]sendcmd=f=resize.cmd,crop@camera=608:1080:601:0:exact=1,format=yuv420p[v]"
          run "resize, crop+scale" "[0:v]sendcmd=f=resize.cmd,crop@camera=608:1080:601:0:exact=1,scale=1080:1920:flags=bicubic,setsar=1,format=yuv420p[v]"
          run "resize, crop+scale no exact" "[0:v]sendcmd=f=resize.cmd,crop@camera=608:1080:601:0,scale=1080:1920:flags=bicubic,setsar=1,format=yuv420p[v]"

      - name: Pytest (unit tests and doctests)
        timeout-minutes: 4
        run: uv run pytest -v
