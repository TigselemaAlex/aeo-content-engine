[project]
name = "content-engine"
version = "0.1.0"
description = "Content Engine worker: transcription, AI generation and video rendering."
readme = "README.md"
authors = [
    { name = "Alex Tigselema", email = "alextp.dev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "assemblyai>=1.10.0",
    "pydantic-settings>=2.16.3",
    "typer>=0.29.1",
]

[project.scripts]
content-engine = "content_engine.main:app"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
