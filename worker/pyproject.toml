[project]
name = "content-engine"
version = "0.1.0"
description = "Content Engine worker: transcription, AI generation and video rendering."
readme = "README.md"
authors = [
    { name = "Alex Tigselema", email = "alextp.dev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "assemblyai>=1.10.0",
    "mediapipe>=1.2.3",
    "numpy>=2.5.5",
    "opencv-contrib-python>=5.1.0.95",
    "pydantic-settings>=2.16.3",
    "typer>=0.29.1",
]

[project.scripts]
content-engine = "content_engine.main:app"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.17",
    "matplotlib>=3.11.2",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests are named after what they check; a docstring is optional (docs/06 §9.1).
"tests/**" = ["D1"]

[tool.importlinter]
root_package = "content_engine"
include_external_packages = true

# docs/06 §5.3. Layers in parentheses do not exist yet; they are checked once created.
[[tool.importlinter.contracts]]
name = "Layers: entry points -> adapters -> modules and piece types -> ports -> shared"
type = "layers"
layers = [
    "content_engine.main | (content_engine.orchestrator) | (content_engine.bootstrap)",
    "content_engine.adapters",
    "content_engine.modules : content_engine.piece_types",
    "(content_engine.ports)",
    "content_engine.shared",
]

[[tool.importlinter.contracts]]
name = "Pure domain: no network, disk, database, video or subprocess"
type = "forbidden"
source_modules = ["content_engine.**.domain"]
forbidden_modules = [
    "psycopg",
    "anthropic",
    "assemblyai",
    "boto3",
    "mediapipe",
    "playwright",
    "subprocess",
    "cv2",
    "content_engine.adapters",
    "content_engine.config",
    "content_engine.main",
]

[[tool.importlinter.contracts]]
name = "Modules use each other only through api.py"
type = "independence"
modules = ["content_engine.modules.*"]
ignore_imports = ["content_engine.modules.** -> content_engine.modules.*.api"]
# No api.py exists yet (Sprint 4); the exception applies once one does.
unmatched_ignore_imports_alerting = "none"

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
