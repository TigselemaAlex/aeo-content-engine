[project]
name = "content-engine"
version = "0.1.0"
description = "Content Engine worker: transcription, AI generation and video rendering."
readme = "README.md"
authors = [
    { name = "Alex Tigselema", email = "alextp.dev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "assemblyai>=1.10.0",
    "mediapipe>=1.2.3",
    "numpy>=2.5.5",
    "opencv-contrib-python>=5.1.0.95",
    "pydantic-settings>=2.16.3",
    "typer>=0.29.1",
]

[project.scripts]
content-engine = "content_engine.main:app"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests are named after what they check; a docstring is optional (docs/06 §9.1).
"tests/**" = ["D1"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
